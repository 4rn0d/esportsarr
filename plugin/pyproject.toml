[project]
name = "esportsarr-plugin"
version = "0.1.0"
description = "Dispatcharr plugin: consolidates esports Twitch channels and switches active stream by live match priority"
requires-python = ">=3.11"
# requests is a runtime dependency of plugin.py, but not of allocator.py,
# the module under test in test_allocator.py has zero third-party deps, so
# `pytest` here only needs the dev extra, not the full runtime env (which
# also needs Django/Dispatcharr itself, only available on the real server).
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["esportsarr*"]
